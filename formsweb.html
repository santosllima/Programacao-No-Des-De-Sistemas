<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    input, select, button {
      margin: 5px 0;
      display: block;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }

    #listBoxClientes {
      height: 120px;
    }

    button {
      cursor: pointer;
    }

    #mensagem {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Cadastro de Clientes</h2>

  <label for="listBoxClientes">Clientes:</label>
  <select id="listBoxClientes" size="5"></select>

  <button type="button" onclick="buscarCliente()">
    Buscar Cliente
  </button>

  <h3>Dados do Cliente</h3>

  <input type="text" id="txtNome" placeholder="Nome">
  <input type="text" id="txtEndereco" placeholder="Endereço">
  <input type="text" id="txtTelefone" placeholder="Telefone">
  <input type="email" id="txtEmail" placeholder="Email">

  <button type="button" onclick="incluirCliente()">
    Incluir Cliente
  </button>

  <button type="button" onclick="alterarCliente()">
    Alterar Cliente
  </button>

  <button type="button" onclick="limparFormulario()">
    Limpar Campos
  </button>

  <p id="mensagem" role="status" aria-live="polite"></p>

  <script>
    // Recupera os clientes salvos no localStorage.
    // Se não houver dados, cria a lista inicial.
    let clientes = JSON.parse(localStorage.getItem("clientes"));

    if (!Array.isArray(clientes)) {
      clientes = [
        {
          id: 1,
          nome: "João Silva",
          endereco: "Rua A",
          telefone: "123456",
          email: "joao@gmail.com"
        },
        {
          id: 2,
          nome: "Maria Oliveira",
          endereco: "Rua B",
          telefone: "654321",
          email: "maria@gmail.com"
        }
      ];

      salvarClientes();
    }

    const listBox = document.getElementById("listBoxClientes");
    const mensagem = document.getElementById("mensagem");

    // Salva a lista completa no localStorage.
    function salvarClientes() {
      localStorage.setItem("clientes", JSON.stringify(clientes));
    }

    // Atualiza automaticamente a lista exibida.
    function atualizarLista() {
      listBox.innerHTML = "";

      clientes.forEach(function(cliente) {
        const option = document.createElement("option");

        option.value = cliente.id;
        option.textContent = cliente.id + " - " + cliente.nome;

        listBox.appendChild(option);
      });
    }

    // Retorna os dados digitados no formulário.
    function obterDadosFormulario() {
      return {
        nome: document.getElementById("txtNome").value.trim(),
        endereco: document.getElementById("txtEndereco").value.trim(),
        telefone: document.getElementById("txtTelefone").value.trim(),
        email: document.getElementById("txtEmail").value.trim()
      };
    }

    // Verifica se todos os campos foram preenchidos.
    function validarCampos(dados) {
      if (
        !dados.nome ||
        !dados.endereco ||
        !dados.telefone ||
        !dados.email
      ) {
        alert("Preencha todos os campos antes de salvar.");
        return false;
      }

      // Validação básica do formato do e-mail.
      const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dados.email);

      if (!emailValido) {
        alert("Informe um endereço de e-mail válido.");
        document.getElementById("txtEmail").focus();
        return false;
      }

      return true;
    }

    // Gera um ID único com base nos IDs existentes.
    function gerarId() {
      return clientes.reduce(function(maiorId, cliente) {
        return Math.max(maiorId, Number(cliente.id) || 0);
      }, 0) + 1;
    }

    // Inclui um novo cliente.
    function incluirCliente() {
      const dados = obterDadosFormulario();

      if (!validarCampos(dados)) {
        return;
      }

      const novoCliente = {
        id: gerarId(),
        nome: dados.nome,
        endereco: dados.endereco,
        telefone: dados.telefone,
        email: dados.email
      };

      clientes.push(novoCliente);

      salvarClientes();
      atualizarLista();

      // Seleciona o cliente recém-incluído.
      listBox.value = String(novoCliente.id);

      mensagem.textContent = "Cliente incluído com sucesso!";
      limparCamposSemMensagem();
    }

    // Busca o cliente selecionado e preenche os campos.
    function buscarCliente() {
      const selectedId = Number(listBox.value);

      const cliente = clientes.find(function(c) {
        return c.id === selectedId;
      });

      if (!cliente) {
        alert("Selecione um cliente na lista.");
        return;
      }

      document.getElementById("txtNome").value = cliente.nome;
      document.getElementById("txtEndereco").value = cliente.endereco;
      document.getElementById("txtTelefone").value = cliente.telefone;
      document.getElementById("txtEmail").value = cliente.email;

      mensagem.textContent = "Dados do cliente carregados.";
    }

    // Altera os dados do cliente selecionado.
    function alterarCliente() {
      const selectedId = Number(listBox.value);

      if (!listBox.value) {
        alert("Selecione um cliente para alterar.");
        return;
      }

      const indice = clientes.findIndex(function(c) {
        return c.id === selectedId;
      });

      if (indice === -1) {
        alert("Cliente não encontrado.");
        return;
      }

      const dados = obterDadosFormulario();

      if (!validarCampos(dados)) {
        return;
      }

      // Mantém o mesmo ID e atualiza os demais dados.
      clientes[indice] = {
        id: clientes[indice].id,
        nome: dados.nome,
        endereco: dados.endereco,
        telefone: dados.telefone,
        email: dados.email
      };

      salvarClientes();
      atualizarLista();

      // Mantém selecionado o cliente alterado.
      listBox.value = String(selectedId);

      mensagem.textContent = "Cliente alterado com sucesso!";
    }

    // Limpa os campos e a seleção.
    function limparFormulario() {
      limparCamposSemMensagem();
      listBox.selectedIndex = -1;
      mensagem.textContent = "";
    }

    function limparCamposSemMensagem() {
      document.getElementById("txtNome").value = "";
      document.getElementById("txtEndereco").value = "";
      document.getElementById("txtTelefone").value = "";
      document.getElementById("txtEmail").value = "";
    }

    // Inicializa a lista ao abrir a página.
    atualizarLista();
  </script>
</body>
</html>
