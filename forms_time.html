<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual o seu Time do Coração?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        select {
            padding: 4px;
            font-size: 16px;
            width: 180px;
        }

        button {
            padding: 4px 12px;
            font-size: 15px;
            cursor: pointer;
        }

        #mensagem {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Qual o seu Time do Coração?</h1>

    <div class="container">
        <select id="timeSelect">
            <option value="Botafogo">Botafogo</option>
            <option value="Flamengo">Flamengo</option>
            <option value="Fluminense">Fluminense</option>
            <option value="Vasco da Gama">Vasco da Gama</option>
        </select>

        <button type="button" onclick="enviar()">Enviar</button>
        <button type="button" onclick="cancelar()">Cancelar</button>
    </div>

    <p id="mensagem"></p>

    <script>
        function enviar() {
            const select = document.getElementById("timeSelect");
            const timeSelecionado = select.value;
            
            // Exibe mensagem na tela e em uma caixa de diálogo (alert)
            alert("Você selecionou o time: " + timeSelecionado);
            document.getElementById("mensagem").textContent = "Seu time do coração é: " + timeSelecionado;
        }

        function cancelar() {
            const select = document.getElementById("timeSelect");
            select.selectedIndex = 0; // Reseta para a primeira opção
            document.getElementById("mensagem").textContent = "Seleção cancelada.";
        }
    </script>

</body>
</html>
